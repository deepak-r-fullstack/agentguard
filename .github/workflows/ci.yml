name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check server and client
        run: npm run typecheck
      - name: Run tests (in-memory MongoDB)
        run: npm test
      - name: Build
        run: npm run build
