name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check server and client
        run: npm run typecheck
      - name: Run tests (in-memory MongoDB)
        run: npm test
      - name: Build
        run: npm run build

      - name: Install browser for guided-demo checks
        run: npx playwright install --with-deps chromium
      - name: Check guided booking workflow on desktop and phone
        run: node checks/walkthrough.mjs
      - name: Save browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screenshots
          path: checks/screenshots/
