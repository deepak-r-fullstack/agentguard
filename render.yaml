# One-click deploy on Render (render.com -> New -> Blueprint -> pick this repo).
# Website and API run as ONE free web service; the database is a free MongoDB Atlas cluster.
services:
  - type: web
    name: agentguard
    runtime: node
    plan: free
    # Close to the Atlas cluster in Mumbai, so each database call is quick.
    region: singapore
    # Dev dependencies (TypeScript, Vite) are needed to build, so include them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://agentguard.sritaraksolutions.in
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: LLM_PROVIDER
        value: none
      # Optional Slack approvals (see docs/slack-setup.md). Leave empty to keep them off.
      - key: SLACK_BOT_TOKEN
        sync: false # "Bot User OAuth Token" (xoxb-...) from the Slack app
      - key: SLACK_SIGNING_SECRET
        sync: false # "Signing Secret" from the Slack app's Basic Information page
      # Optional AgentReplay recording of playground runs (see README). Leave empty to keep it off.
      - key: AGENTREPLAY_API_KEY
        sync: false # SDK key (ar_...) from AgentReplay's "Apps and keys" screen
      - key: AGENTREPLAY_URL
        sync: false # only for a self-hosted AgentReplay; empty means the hosted site
      # The test-only in-memory MongoDB is not needed on the server; skip its download.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
